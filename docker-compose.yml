services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: slotwise
      POSTGRES_DB: slotwise
    ports:
      - "5435:5432"
    volumes:
      - slotwise-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotwise -d slotwise"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build: .
    environment:
      # The app reads ConnectionStrings:Slotwise; inside the compose
      # network the database is the `db` service over TCP.
      ConnectionStrings__Slotwise: "Host=db;Port=5432;Database=slotwise;Username=slotwise;Password=slotwise"
      ASPNETCORE_URLS: "http://+:8080"
      # PathBase is deliberately unset locally: the app serves at the
      # root. The server override sets PathBase=/slotwise.
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  slotwise-db:
